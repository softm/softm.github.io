  <meta http-equiv="refresh" content="0;url=https://homecare.designboard.net/?type=daycare">
  <script>
    /** SOFTM-LEGACY-CARE-REDIRECT START 날짜:20261026 : 폐기한 프록시를 쓰는 예전 지도를 공식 돌봄한눈 지도에 연결 */
    (() => {
      const current = new URL(window.location.href);
      const destination = new URL('https://homecare.designboard.net/');
      destination.searchParams.set('type', 'daycare');
      for (const [key, value] of current.searchParams) {
        if (key !== 'type') destination.searchParams.set(key, value);
      }
      destination.hash = current.hash;
      window.location.replace(destination.href);
    })();
    /** SOFTM-LEGACY-CARE-REDIRECT END */
  </script>
</head>
<body>
