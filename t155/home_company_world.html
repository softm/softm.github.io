<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>집/회사 · 해외 지도</title>
  <link rel="stylesheet" href="lib/material-components-web.min.css"><link rel="stylesheet" href="lib/icon.css"><link rel="stylesheet" href="lib/common.css?a=6"><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css"><link rel="stylesheet" href="lib/world_navi_style.css?a=1">
</head>
<body>
  <div class="i18n google-navi-shell">
    <header class="mdc-top-app-bar mdc-top-app-bar--fixed"><div class="mdc-top-app-bar__row">
      <section class="mdc-top-app-bar__section mdc-top-app-bar__section--align-start"><button type="button" id="btnHome" class="none mdc-icon-button material-icons mdc-top-app-bar__navigation-icon--unbounded">home</button><button type="button" id="btnBack" class="mdc-icon-button material-icons mdc-top-app-bar__navigation-icon--unbounded">arrow_back_ios</button><span class="mdc-top-app-bar__title">집/회사 · 해외 지도</span></section>
      <section class="mdc-top-app-bar__section mdc-top-app-bar__section--align-end"><button type="button" id="btnSwitchMapMode" onclick="return fn_SwitchMapMode();" class="mdc-icon-button mdc-top-app-bar__action-item--unbounded map-mode-switch-button"><span class="material-icons map-mode-switch-icon">swap_horiz</span><span class="map-mode-switch-label">티맵지도 보기</span></button><button type="button" id="btnSettings" class="none mdc-icon-button material-icons mdc-top-app-bar__action-item--unbounded">settings</button></section>
    </div></header>
    <div class="google-navi-page google-navi-home-page google-navi-page--with-top-app-bar">
      <button type="button" id="btnMyLocation" class="icon-button" title="현재 위치" aria-label="현재 위치">◎</button>
      <nav class="google-navi-tabs" aria-label="목적지 유형"><button type="button" class="google-navi-tab" data-mode="home"><span class="material-icons google-navi-tab-icon">home</span><span class="google-navi-tab-label" data-i18n="label.home">집</span></button><button type="button" class="google-navi-tab" data-mode="company"><span class="material-icons google-navi-tab-icon">business</span><span class="google-navi-tab-label" data-i18n="label.company">회사</span></button><button type="button" class="google-navi-tab" data-mode="favorite"><span class="material-icons google-navi-tab-icon">place</span><span class="google-navi-tab-label" data-i18n="label.favorite">즐겨찾기</span></button><button type="button" class="google-navi-tab" data-mode="recent"><span class="material-icons google-navi-tab-icon">schedule</span><span class="google-navi-tab-label" data-i18n="label.recent">최근</span></button></nav>
      <div class="world-service-note">OpenFreeMap 지도 · Geoapify 장소 검색</div><section id="guidePanel" class="google-navi-guide"></section>
      <section id="searchPanel" class="google-navi-search"><input id="keyword" type="search" autocomplete="off" placeholder="장소명 또는 주소"><button type="button" id="btnSearch" class="google-navi-button" data-i18n="label.search">검색</button></section>
      <div id="statusText" class="google-navi-status">초기화 중입니다...</div>
      <main class="google-navi-content"><section id="poiList" class="google-navi-list empty" aria-label="목적지 목록"></section><section id="googleMap" class="google-navi-map" aria-label="해외 지도"></section></main>
      <div id="placeAddress" class="google-navi-address-overlay"></div><div id="googleNaviSnackbar" class="google-navi-snackbar"></div>
      <footer class="google-navi-footer"><button type="button" id="btnNavi" class="google-navi-button" data-i18n="google_navi.start_navi">내비 시작</button><button type="button" id="btnDelete" class="google-navi-button danger" data-i18n="google_navi.delete">삭제</button><button type="button" id="btnPrimary" class="google-navi-button primary" data-i18n="google_navi.save">저장</button></footer>
    </div>
  </div>
  <script src="lib/i18n_messages.js?a=1"></script><script src="lib/google_navi_i18n.js?a=3"></script><script src="lib/interface.js?a=7"></script><script src="lib/db.js"></script><script src="lib/map_point.js"></script>
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script><script src="lib/world_navi_map.js?a=1"></script><script src="lib/google_navi_pages.js?a=6"></script>
  <script>initGoogleNaviPage("home");</script>
</body>
</html>
