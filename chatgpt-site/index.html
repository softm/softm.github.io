<style>
:root{--navy:#17324d;--blue:#2f6eaa;--ink:#1c2833;--muted:#66737f;--line:#d9e1e8;--bg:#f3f6f9;--paper:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 system-ui,-apple-system,"Noto Sans KR","Apple SD Gothic Neo",sans-serif}.hero{background:linear-gradient(135deg,#112b42,#2e6697);color:#fff;padding:58px 0 50px}.wrap{max-width:1050px;margin:auto;padding:0 22px}.eyebrow{font-size:14px;font-weight:800;letter-spacing:.04em;opacity:.85}h1{margin:8px 0 12px;font-size:clamp(34px,6vw,55px);line-height:1.18}.lead{max-width:760px;font-size:19px;color:#e2eef8}.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.pill{border:1px solid #ffffff55;background:#ffffff14;border-radius:999px;padding:5px 11px;font-size:13px}main{padding:34px 0 70px}.section-title{margin:0 0 17px;font-size:27px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.card{display:block;background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:23px;color:inherit;text-decoration:none;box-shadow:0 4px 17px #12283c0b;transition:.16s ease}.card:hover{transform:translateY(-2px);border-color:#91b8d9;box-shadow:0 8px 25px #12283c16}.tag{display:inline-block;background:#eaf4ff;color:#235f94;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:800}.card h2{margin:12px 0 7px;font-size:25px}.card p{margin:0;color:#50616e}.count{margin-top:16px;font-size:14px;color:var(--muted)}footer{border-top:1px solid var(--line);padding:28px 0;color:var(--muted);background:#fff}@media(max-width:620px){.hero{padding:40px 0}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
