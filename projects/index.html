<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>아카이브 프로젝트</title><style>body{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;max-width:760px;margin:48px auto;padding:0 20px;line-height:1.7}h1{margin-bottom:8px}.box{padding:20px;border:1px solid #ddd;border-radius:12px;background:#fafafa}</style></head><body><main><h1>아카이브 프로젝트</h1><div class="box"><p>기존 아카이브 배포 콘텐츠를 전체 초기화했습니다.</p><p>현재 등록된 새 아카이브 기록은 없습니다.</p><p>앞으로는 아카이브 배포 프롬프트 규칙에 따라 프로젝트와 기록을 처음부터 다시 등록합니다.</p></div></main></body></html>
