<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="softm 프로젝트별 공개 웹 배포 인덱스">
  <title>웹 배포 프로젝트 | softm</title>
  <style>
    :root{--bg:#f3f7f4;--paper:#fff;--ink:#17251d;--muted:#68766d;--line:#dce6df;--brand:#1f6b42;--dark:#164c31;--soft:#e8f4ec;--shadow:0 18px 50px rgba(25,55,37,.1)}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 8% 0%,rgba(109,190,139,.18),transparent 28rem),var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif}a{color:inherit}.wrap{width:min(1120px,calc(100% - 40px));margin:auto}
    .hero{position:relative;overflow:hidden;padding:68px 0 62px;background:linear-gradient(135deg,#113925,#246b45 62%,#3d875c);color:#fff}.hero:after{content:"";position:absolute;right:-110px;bottom:-230px;width:360px;height:360px;border:54px solid rgba(255,255,255,.09);border-radius:50%}.eyebrow{margin:0 0 12px;color:#bfe7cb;font-size:.82rem;font-weight:800;letter-spacing:.12em}.hero h1{margin:0;font-size:clamp(2.2rem,5vw,3.7rem);line-height:1.1;letter-spacing:-.045em}.hero p:last-child{max-width:720px;margin:18px 0 0;color:#dceee2;font-size:1.08rem}
    .toolbar{position:relative;z-index:2;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;margin-top:-28px;padding:16px;border:1px solid rgba(220,230,223,.9);border-radius:18px;background:rgba(255,255,255,.96);box-shadow:var(--shadow)}.search{width:100%;min-height:48px;padding:0 16px;border:1px solid var(--line);border-radius:12px;background:#f8faf8;font:inherit}.counter{padding:8px 12px;border-radius:999px;background:var(--soft);color:var(--dark);font-size:.86rem;font-weight:800;white-space:nowrap}
    main{padding:52px 0 76px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:18px}.section-head h2{margin:0;font-size:clamp(1.45rem,3vw,1.9rem)}.section-head p{margin:5px 0 0;color:var(--muted);font-size:.9rem}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{display:flex;min-height:310px;flex-direction:column;padding:26px;border:1px solid var(--line);border-top:5px solid var(--brand);border-radius:6px 6px 19px 19px;background:var(--paper);box-shadow:0 8px 28px rgba(33,65,44,.06)}.card-top{display:flex;justify-content:space-between;gap:14px}.card h3{margin:0;font-size:1.55rem}.repo{margin-top:5px;color:var(--muted);font-size:.8rem}.badge{height:max-content;padding:4px 9px;border-radius:999px;background:var(--soft);color:var(--dark);font-size:.75rem;font-weight:800}.badge.private{background:#edf0f3;color:#4d5660}.badge.mixed{background:#f7efe3;color:#7a4d18}.card.private{border-top-color:#697681}.card.mixed{border-top-color:#9a641f}.description{margin:20px 0;color:#4d5e53}.meta{display:grid;gap:7px;margin:auto 0 18px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:.82rem}.meta b{color:var(--ink)}.actions{display:flex;flex-wrap:wrap;gap:8px}.action{display:inline-flex;min-height:40px;align-items:center;justify-content:center;padding:8px 14px;border:1px solid var(--line);border-radius:10px;text-decoration:none;font-size:.86rem;font-weight:800}.action.primary{border-color:var(--brand);background:var(--brand);color:#fff}.action.disabled{cursor:default;background:#f3f5f4;color:#768078}.policy{margin-top:34px;padding:19px 21px;border-left:4px solid #78a388;border-radius:12px;background:#eaf1ec;color:#536158;font-size:.88rem}.empty{grid-column:1/-1;padding:28px;border:1px dashed #bdcac0;border-radius:14px;text-align:center;color:var(--muted)}footer{padding:0 0 42px;color:var(--muted);text-align:center;font-size:.82rem}[hidden]{display:none!important}
    @media(max-width:760px){.toolbar,.grid{grid-template-columns:1fr}.section-head{align-items:flex-start;flex-direction:column}.card{min-height:0}}@media(max-width:520px){.wrap{width:min(100% - 28px,1120px)}.hero{padding:50px 0 48px}.card{padding:22px}.action{flex:1}}
  </style>
</head>
<body>
  <header class="hero"><div class="wrap"><p class="eyebrow">SOFTM · PROJECT DIRECTORY</p><h1>웹 배포 프로젝트</h1><p>여기서는 프로젝트만 선택합니다. 각 프로젝트에 들어가면 그 프로젝트에 해당하는 채팅별 공개 페이지만 표시됩니다.</p></div></header>
  <div class="wrap"><div class="toolbar"><input id="search" class="search" type="search" placeholder="프로젝트명, 저장소명, 설명 검색" aria-label="프로젝트 검색"><span id="count" class="counter">프로젝트 0</span></div></div>
  <main class="wrap">
    <div class="section-head"><div><h2>프로젝트 목록</h2><p>등록된 프로젝트 저장소를 기준으로 표시합니다.</p></div></div>
    <section id="grid" class="grid" aria-live="polite"></section>
    <p class="policy">공개·비공개 프로젝트의 생성과 공개 범위 변경은 모두 이 인덱스에 반영합니다. 비공개 콘텐츠와 저장소 주소는 노출하지 않고 프로젝트 상태만 표시합니다.</p>
  </main>
  <footer class="wrap">프로젝트 콘텐츠는 각 프로젝트 저장소에서 관리합니다.</footer>
  <script>
    (() => {
      const grid = document.querySelector("#grid");
      const search = document.querySelector("#search");
      const count = document.querySelector("#count");
      const node = (tag, cls, text) => {
        const el = document.createElement(tag);
        if (cls) el.className = cls;
        if (text !== undefined) el.textContent = text;
        return el;
      };
      const safeUrl = (value) => {
        try {
          const url = new URL(value, location.href);
          return ["http:", "https:"].includes(url.protocol) ? url.href : "#";
        } catch {
          return "#";
        }
      };
      const visibilityLabel = (value) => ({
        public: "공개",
        private: "비공개",
        mixed: "공개+비공개"
      }[value] || "프로젝트");
      const statusLabel = (value) => value === "pending" ? "배포 준비 중" : "운영 중";

      const render = (projects) => {
        grid.replaceChildren(...projects.map((project) => {
          const visibility = project.visibility || "public";
          const card = node("article", `card ${visibility}`);
          card.dataset.repo = project.repo;
          card.dataset.search = [
            project.title,
            project.repo,
            project.description,
            project.category,
            visibilityLabel(visibility),
            statusLabel(project.deploymentStatus)
          ].filter(Boolean).join(" ").toLowerCase();

          const top = node("div", "card-top");
          const heading = node("div");
          const repoText = project.repoVisibility === "private"
            ? `${project.repo} · 저장소 비공개`
            : `${project.owner}/${project.repo}`;
          heading.append(node("h3", "", project.title), node("div", "repo", repoText));
          top.append(heading, node("span", `badge ${visibility}`, visibilityLabel(visibility)));
          card.append(top, node("p", "description", project.description));

          const meta = node("div", "meta");
          const deployment = node("span");
          deployment.append("배포 상태 ", node("b", "", statusLabel(project.deploymentStatus)));
          meta.append(deployment);

          if (visibility !== "private") {
            const pages = node("span");
            pages.append("공개 채팅 ", node("b", "page-count", `${project.pageCount ?? 0}개`));
            meta.append(pages);
          }
          if (visibility !== "public") {
            const privatePages = node("span");
            privatePages.append("비공개 채팅 ", node("b", "", `${project.privatePageCount ?? 0}개`));
            meta.append(privatePages);
          }
          const latest = node("span");
          latest.append("최근 페이지 ", node("b", "latest-title", project.latestTitle || "등록 정보 없음"));
          meta.append(latest);
          card.append(meta);

          const actions = node("div", "actions");
          if (project.publicUrl) {
            const site = node("a", "action primary", "공개 사이트");
            site.href = safeUrl(project.publicUrl);
            actions.append(site);
          }
          if (project.repoVisibility === "public") {
            const repo = node("a", "action", "GitHub");
            repo.href = safeUrl(`https://github.com/${project.owner}/${project.repo}`);
            actions.append(repo);
          }
          if (project.privateUrl) {
            const privateLink = node("a", "action", "비공개 사이트");
            privateLink.href = safeUrl(project.privateUrl);
            actions.append(privateLink);
          } else if (visibility !== "public") {
            actions.append(node("span", "action disabled", "비공개 · 인증 필요"));
          }
          if (!project.publicUrl && visibility === "public") {
            actions.append(node("span", "action disabled", "배포 준비 중"));
          }
          card.append(actions);
          return card;
        }));

        if (!projects.length) grid.append(node("div", "empty", "등록된 프로젝트가 없습니다."));
        count.textContent = `프로젝트 ${projects.length}`;
      };

      const syncProjectStats = async (project) => {
        if (!project.pageSelector || !project.publicUrl) return;
        try {
          const url = new URL(safeUrl(project.publicUrl));
          url.searchParams.set("project-index-sync", Date.now());
          const response = await fetch(url, { cache: "no-store" });
          if (!response.ok) return;
          const doc = new DOMParser().parseFromString(await response.text(), "text/html");
          const entries = [...doc.querySelectorAll(project.pageSelector)];
          if (!entries.length) return;
          const card = [...grid.querySelectorAll("[data-repo]")].find((item) => item.dataset.repo === project.repo);
          if (!card) return;
          card.querySelector(".page-count").textContent = `${entries.length}개`;
          const latest = doc.querySelector(project.titleSelector || `${project.pageSelector} h3`)?.textContent?.trim();
          if (latest) card.querySelector(".latest-title").textContent = latest;
        } catch {}
      };

      fetch("./projects.json", { cache: "no-store" })
        .then((response) => {
          if (!response.ok) throw new Error();
          return response.json();
        })
        .then((config) => {
          const projects = (config.projects || [])
            .map((project) => ({ ...project, owner: config.owner || "softm" }))
            .sort((a, b) => (a.order ?? 999) - (b.order ?? 999));
          render(projects);
          projects.forEach(syncProjectStats);
        })
        .catch(() => grid.append(node("div", "empty", "프로젝트 목록을 불러오지 못했습니다.")));

      search.addEventListener("input", () => {
        const query = search.value.trim().toLowerCase();
        document.querySelectorAll("[data-search]").forEach((element) => {
          element.hidden = Boolean(query) && !element.dataset.search.includes(query);
        });
      });
    })();
  </script>
</body>
</html>
