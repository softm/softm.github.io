<!DOCTYPE html>
<!-- SOFTM-GOOGLE START: Google 지도 기반 검색/최근/즐겨찾기 화면 신규 구성. 2026-05-16 -->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title data-i18n="title.favorite">즐겨찾기</title> <!-- SOFTM-I18N: Google 검색 화면 제목을 다국어 키로 연결. 2026-05-19 -->
  <link rel="stylesheet" href="lib/material-components-web.min.css">
  <link rel="stylesheet" href="lib/icon.css"> <!-- SOFTM-GOOGLE: 검색 화면 탭 아이콘 표시를 위해 로컬 Material Icons 폰트를 사용. 2026-05-17 -->
  <link rel="stylesheet" href="lib/common.css?a=6">
  <link rel="stylesheet" href="lib/google_navi_style.css?a=3"> <!-- SOFTM-READABILITY: 삭제 버튼 대비 개선 스타일 캐시 갱신. 2026-05-19 -->
</head>
<body>
  <div class="i18n google-navi-shell">
    <!-- SOFTM-HEADER START: 기존 search.html 헤더와 동일한 MDC 상단바 적용. 2026-05-19 -->
    <header class="mdc-top-app-bar mdc-top-app-bar--fixed">
      <div class="mdc-top-app-bar__row">
        <section class="mdc-top-app-bar__section mdc-top-app-bar__section--align-start">
          <button type="button" id="btnBack"
            class="mdc-icon-button material-icons mdc-top-app-bar__navigation-icon--unbounded">arrow_back_ios</button>
          <span class="mdc-top-app-bar__title" data-i18n="title.favorite">즐겨찾기</span> <!-- SOFTM-I18N: Google 검색 헤더 제목을 다국어 키로 연결. 2026-05-19 -->
        </section>
        <!-- SOFTM-MAPSWITCH START: search_google 화면에서 티맵지도 화면으로 전환하는 헤더 버튼 추가. 2026-05-19 -->
        <section class="mdc-top-app-bar__section mdc-top-app-bar__section--align-end">
          <button type="button" id="btnSwitchMapMode" onclick="return fn_SwitchMapMode();"
            class="mdc-icon-button mdc-top-app-bar__action-item--unbounded map-mode-switch-button">
            <span class="material-icons map-mode-switch-icon" aria-hidden="true">swap_horiz</span>
            <span class="map-mode-switch-label" data-i18n="google_navi.switch_to_tmap">티맵지도 보기</span>
          </button>
        </section>
        <!-- SOFTM-MAPSWITCH END -->
      </div>
    </header>
    <!-- SOFTM-HEADER END -->

    <div class="google-navi-page google-navi-page--with-top-app-bar">
      <button type="button" id="btnMyLocation" class="icon-button" title="현재 위치" data-i18n="[title]google_navi.current_location;[aria-label]google_navi.current_location">◎</button>

    <!-- SOFTM-GOOGLE START: 검색 화면 탭을 첨부 시안처럼 아이콘+텍스트+하단 활성 라인 구조로 변경. 2026-05-17 -->
    <nav class="google-navi-tabs" aria-label="검색 유형" data-i18n="[aria-label]google_navi.search_type">
      <button type="button" class="google-navi-tab" data-mode="recent"><span class="material-icons google-navi-tab-icon" aria-hidden="true">search</span><span class="google-navi-tab-label" data-i18n="label.recent">최근</span></button>
      <button type="button" class="google-navi-tab" data-mode="search"><span class="material-icons google-navi-tab-icon" aria-hidden="true">star</span><span class="google-navi-tab-label" data-i18n="label.search">검색</span></button>
      <button type="button" class="google-navi-tab" data-mode="favorite"><span class="material-icons google-navi-tab-icon" aria-hidden="true">place</span><span class="google-navi-tab-label" data-i18n="label.favorite">즐겨찾기</span></button>
      <button type="button" class="google-navi-tab" data-mode="map"><span class="material-icons google-navi-tab-icon" aria-hidden="true">map</span><span class="google-navi-tab-label" data-i18n="label.map">지도</span></button>
    </nav>
    <!-- SOFTM-GOOGLE END -->

    <section id="searchPanel" class="google-navi-search">
      <input id="keyword" type="search" autocomplete="off" placeholder="장소명 또는 주소" data-i18n="[placeholder]google_navi.place_or_address">
      <button type="button" id="btnSearch" class="google-navi-button" data-i18n="label.search">검색</button>
    </section>

    <div id="statusText" class="google-navi-status" data-i18n="google_navi.initializing">초기화 중입니다...</div>

    <main class="google-navi-content">
      <section id="poiList" class="google-navi-list empty" aria-label="목적지 목록" data-i18n="[aria-label]google_navi.destination_list"></section>
      <section id="googleMap" class="google-navi-map" aria-label="Google 지도" data-i18n="[aria-label]google_navi.google_map"></section>
    </main>

    <div id="placeAddress" class="google-navi-address-overlay"></div>
    <div id="googleNaviSnackbar" class="google-navi-snackbar"></div>

    <footer class="google-navi-footer">
      <button type="button" id="btnNavi" class="google-navi-button" data-i18n="google_navi.start_navi">내비 시작</button>
      <button type="button" id="btnDelete" class="google-navi-button danger" data-i18n="google_navi.delete">삭제</button>
      <button type="button" id="btnPrimary" class="google-navi-button primary" data-i18n="google_navi.add_favorite">즐겨찾기 추가</button>
    </footer>
    </div>
  </div>

  <!-- SOFTM-I18N START: Google 단독 페이지에서 기존 lng 설정을 공유하는 다국어 헬퍼 로드. 2026-05-19 -->
  <script src="lib/google_navi_i18n.js?a=3"></script>
  <!-- SOFTM-I18N END -->
  <script src="lib/interface.js?a=3"></script>
  <script src="lib/db.js"></script>
  <script src="lib/map_point.js"></script>
  <script src="lib/google_navi_map.js"></script>
  <script src="lib/google_navi_pages.js?a=2"></script> <!-- SOFTM-FAVORITESYNC: 오버레이 즐겨찾기 동기화 스크립트 캐시 갱신. 2026-05-19 -->
  <script>
    initGoogleNaviPage("search");
  </script>
</body>
</html>
<!-- SOFTM-GOOGLE END -->
