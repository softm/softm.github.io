name: Cloudflare account implementation checks
on:
  push:
    paths:
      - "services/cloudflare-account/**"
      - ".github/workflows/cloudflare-account-check.yml"
  pull_request:
    paths:
      - "services/cloudflare-account/**"
      - ".github/workflows/cloudflare-account-check.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/cloudflare-account
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wrangler
        run: npm install --no-audit --no-fund
      - name: Syntax checks
        run: npm run check
      - name: Unit and security smoke tests
        run: npm test
      - name: Validate migration preparation syntax
        run: node --check scripts/prepare-migration.mjs
      - name: Real local Workers + D1 integration
        run: node scripts/local-smoke.mjs
      - name: Verify secrets never committed
        run: |
          test -z "$(git ls-files -- '.dev.vars' '.dev.vars.*' 'node_modules/**' 'migration-*.sql' 'migration-*.json')"
          test ! -f .dev.vars
# No production deployment from this workflow: controlled manual cutover only.
