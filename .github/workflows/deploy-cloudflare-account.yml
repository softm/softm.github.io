name: Deploy isolated Cloudflare account Worker
on:
  push:
    branches: [main]
    paths:
      - 'services/cloudflare-account/**'
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY_STAGING to deploy the isolated Worker (never modifies Firebase)"
        required: true
        type: string
permissions:
  contents: read
jobs:
  deploy:
    if: ${{ github.event_name == 'push' || github.event.inputs.confirmation == 'DEPLOY_STAGING' }}
    runs-on: ubuntu-latest
    environment: cloudflare-account-staging
    defaults:
      run:
        working-directory: services/cloudflare-account
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_BASE_URL: ${{ vars.SOFTM_ACCOUNT_PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check staging deployment settings
        id: settings
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$PUBLIC_BASE_URL" ]; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "Missing Cloudflare staging credentials or public URL"; exit 1
            fi
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Staging is not connected yet; Cloudflare deployment skipped safely."
            exit 0
          fi
          case "$PUBLIC_BASE_URL" in
            https://*.workers.dev|https://*.designboard.net) ;;
            *) echo "Invalid Worker URL setting"; exit 1 ;;
          esac
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Install Wrangler
        if: steps.settings.outputs.ready == 'true'
        run: npm install --no-audit --no-fund
      - name: Verify implementation
        if: steps.settings.outputs.ready == 'true'
        run: npm run check && npm test
      - name: Pin exact Worker URL in local config
        if: steps.settings.outputs.ready == 'true'
        run: |
          node -e 'const fs=require("fs");const p="wrangler.jsonc";const c=JSON.parse(fs.readFileSync(p,"utf8"));c.vars.PUBLIC_BASE_URL=process.env.PUBLIC_BASE_URL;fs.writeFileSync(p,JSON.stringify(c,null,2));'
      - name: Verify existing D1 database access
        if: steps.settings.outputs.ready == 'true'
        run: npx wrangler d1 info softm-hannun-account
      - name: Create database schema
        if: steps.settings.outputs.ready == 'true'
        run: npx wrangler d1 execute softm-hannun-account --remote --file=schema.sql --yes
      - name: Deploy isolated Worker with existing D1 binding
        if: steps.settings.outputs.ready == 'true'
        run: npx wrangler deploy
      - name: Check Worker health
        if: steps.settings.outputs.ready == 'true'
        run: curl --fail --silent --show-error "$PUBLIC_BASE_URL/health"
# OAuth provider client secrets and callback registrations must be set separately.
# This workflow does not switch existing apps, Firebase, or Android clients.
