name: Archive format viewers
on:
  push:
    branches: [main]
    paths: ['.github/workflows/archive-viewers-reusable.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: write
concurrency:
  group: archive-viewers-${{ github.repository }}
  cancel-in-progress: false
jobs:
  policy:
    if: github.repository == 'softm/softm.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          sparse-checkout: |
            projects/archive-deployment
            projects/projects.json
          sparse-checkout-cone-mode: false
      - run: python projects/archive-deployment/viewer/install.py --policy
      - name: Commit central viewer standards only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- projects/archive-deployment projects/projects.json
          if ! git diff --cached --quiet; then
            git commit -m 'docs(archive): require appropriate viewers and players for every supported format'
            git push origin HEAD:main
          fi
  install:
    if: github.repository != 'softm/softm.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current private/public project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          path: target
      - name: Checkout reviewed common implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: softm/softm.github.io
          ref: 3bbc7b85db1756e9f625ada675b22146127a8fc2
          path: viewer-source
          sparse-checkout: projects/archive-deployment/viewer
          persist-credentials: false
      - name: Fetch fixed browser libraries without install scripts
        run: |
          mkdir -p "$RUNNER_TEMP/av-vendor"
          cd "$RUNNER_TEMP/av-vendor"
          npm init -y >/dev/null
          npm install --ignore-scripts --save-exact jszip@3.10.1 docx-preview@0.3.6 dompurify@3.4.16 marked@15.0.12 pdfjs-dist@5.4.149
          npm audit --omit=dev --audit-level=moderate
          curl --fail --location --retry 2 --proto '=https' 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js' -o xlsx.full.min.js
      - name: Install browser-test and optional image-preview tools
        run: |
          python -m pip install 'playwright==1.55.0' 'Pillow==11.3.0' 'pillow-heif==1.1.1'
          python -m playwright install --with-deps chromium
      - name: Add viewers and verify every original hash
        run: |
          node --check viewer-source/projects/archive-deployment/viewer/viewer.js
          python viewer-source/projects/archive-deployment/viewer/install.py --root "$GITHUB_WORKSPACE/target" --vendor "$RUNNER_TEMP/av-vendor"
      - name: Test real original files and isolated format fixtures
        working-directory: target
        run: python -u ../viewer-source/projects/archive-deployment/viewer/test_viewer.py
      - name: Commit tested viewer output only
        working-directory: target
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- archive archive-manifest.json index.html
          if ! git diff --cached --quiet; then
            git commit -m 'feat(archive): verified multi-format viewers; preserve originals and authentication'
            git push origin HEAD:main
          fi
      - name: Preserve input queue and deployment configuration
        run: echo 'No zip input deleted; no authentication or deployment storage changes; live deployment verification remains required.'
