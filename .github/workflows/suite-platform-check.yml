name: Check common account and site vaults
on:
  push:
    branches: [main]
    paths: ['shared/platform/**','services/suite-platform/**','account/**','.github/workflows/suite-platform-check.yml']
  pull_request:
    paths: ['shared/platform/**','services/suite-platform/**','account/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/suite-platform
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            shared/platform
            services/suite-platform
            account
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix functions --ignore-scripts --no-audit --no-fund
      - run: |
          cmp ../../shared/platform/v1/registry.json functions/registry.json
          node --check ../../shared/platform/v1/sdk.mjs
          node --check ../../account/hub.mjs
          node --check functions/index.mjs
          npm test
      - run: npx -y firebase-tools@latest emulators:exec --project demo-softm-suite --only firestore 'npm run test:rules'
