name: Check common account and site vaults
on:
  push:
    branches: [main]
    paths: ['shared/platform/**','services/suite-platform/**','account/**','.github/workflows/suite-platform-check.yml']
  pull_request:
    paths: ['shared/platform/**','services/suite-platform/**','account/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/suite-platform
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            shared/platform
            services/suite-platform
            account
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix functions --ignore-scripts --no-audit --no-fund
      - run: |
          cmp ../../shared/platform/v1/registry.json functions/registry.json
          for file in ../../shared/platform/v1/*.mjs; do node --check "$file"; done
          for file in ../../account/*.mjs; do node --check "$file"; done
          node --check functions/index.mjs
          npm test
      - run: npx -y firebase-tools@latest emulators:exec --project demo-softm-suite --only firestore,auth 'npm run test:rules'
      - name: Install isolated browser verification runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/suite-ui" --no-save --ignore-scripts --no-audit --no-fund playwright
          "$RUNNER_TEMP/suite-ui/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify browser vault with synthetic data
        env:
          SUITE_UI_RUNTIME: '${{ runner.temp }}/suite-ui'
          SUITE_UI_OUTPUT: '${{ runner.temp }}/suite-ui-results'
        run: |
          mkdir -p "$SUITE_UI_OUTPUT"
          node tests/site-vault-ui.cjs
          node tests/account-feedback-ui.cjs
          node tests/account-handoff-ui.cjs
          node tests/account-withdrawal-ui.cjs
          node tests/account-menu-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suite-vault-browser-verification
          path: '${{ runner.temp }}/suite-ui-results'
