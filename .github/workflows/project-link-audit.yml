name: Audit project chat links
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - projects/audit-links.cjs
      - .github/workflows/project-link-audit.yml
permissions:
  contents: read
concurrency:
  group: project-chat-link-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Audit the exact rendered URLs without credentials
        run: |
          node --version
          node projects/audit-links.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: project-chat-link-audit
          path: projects/link-audit/latest.json
