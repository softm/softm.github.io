name: Sync requested hwagok sprinkler archive
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-hwagok-sprinkler-20260809.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: public-project-homes
  cancel-in-progress: false
jobs:
  publish-current-catalog:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: projects
      - name: Validate registered record and preserve all current project metadata
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('projects/projects.json').read_text())
          p=next(p for p in data['projects'] if p['repo']=='hwagok-farm')
          expected='https://softm.github.io/hwagok-farm/records/20260809-sprinkler-piping-plan/'
          found=[r for r in p['links'] if r.get('url')==expected]
          assert len(found)==1 and found[0]['visibility']=='public'
          assert any(r.get('visibility')=='private' for r in p['links']), 'Existing private links must remain'
          print(json.dumps({'requestedRecord':expected,'public':sum(r.get('visibility')=='public' for r in p['links']),'private':sum(r.get('visibility')=='private' for r in p['links']),'metadataModified':False}))
          PY
          node --check projects/project-home.js
          node projects/project-home.test.cjs
          node projects/archive-sync.test.cjs
      - name: Publish through actual existing Pages source without modifying Pages settings
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_WORKTREE: ${{ runner.temp }}/sprinkler-central-pages
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pages" > /tmp/sprinkler-pages.json
          SOURCE="$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/sprinkler-pages.json'))
          print(json.dumps({'build_type':d.get('build_type'),'source':d.get('source')},ensure_ascii=False),file=__import__('sys').stderr)
          assert d['build_type']=='legacy', 'Existing workflow-based Pages deployment must be used instead; settings were not changed'
          assert d['source']['path']=='/' and d['source']['branch'] in ('main','gh-pages'), 'Unrecognized existing Pages source; settings left unchanged'
          print(d['source']['branch'])
          PY
          )"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$SOURCE" = gh-pages ]; then
            git fetch --depth=1 origin gh-pages
            git worktree add "$PAGE_WORKTREE" FETCH_HEAD
            for f in projects/projects.json projects/index.html projects/hwagok-farm/index.html projects/project-home.js; do
              mkdir -p "$PAGE_WORKTREE/$(dirname "$f")"
              cp "$f" "$PAGE_WORKTREE/$f"
            done
            git -C "$PAGE_WORKTREE" add -- projects/projects.json projects/index.html projects/hwagok-farm/index.html projects/project-home.js
            if ! git -C "$PAGE_WORKTREE" diff --cached --quiet; then
              git -C "$PAGE_WORKTREE" commit -m 'projects: publish sprinkler record and retained private entries'
              git -C "$PAGE_WORKTREE" push origin HEAD:gh-pages
            fi
          else
            echo 'Pages uses main: publish already-committed current catalogue, without copying another branch.'
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" > /tmp/sprinkler-build.json
          BUILD_ID="$(python3 -c 'import json;print(json.load(open("/tmp/sprinkler-build.json"))["url"].rstrip("/").split("/")[-1])')"
          for attempt in $(seq 1 80); do
            STATUS="$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/$BUILD_ID" --jq '.status')"
            echo "Pages build $BUILD_ID: $STATUS"
            if [ "$STATUS" = built ]; then exit 0; fi
            if [ "$STATUS" = errored ]; then exit 1; fi
            sleep 10
          done
          exit 1
