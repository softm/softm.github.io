name: Sync canonical archive catalog
on:
  push:
    branches: [main]
    paths:
      - 'projects/archive-sync.js'
      - 'projects/archive-sync.test.cjs'
      - 'projects/sync-archive-catalog.py'
      - 'projects/home-generator.py'
      - '.github/workflows/archive-catalog-sync.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-project-homes
  cancel-in-progress: false
jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Generate from published canonical HTML and run regression tests
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin main
          python3 projects/home-generator.py
          node projects/archive-sync.test.cjs
          node projects/project-home.test.cjs
          node projects/test-title-parity.cjs
          git add -- projects
          if git diff --cached --name-status | grep -q '^D'; then
            echo 'Refusing deletion of an archive file'; exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Sync project homes from canonical ZIP archive source'
            git push origin HEAD:main
          fi
      - name: Preserve existing publishing branch and copy generated index files only
        env:
          PAGE_WORKTREE: ${{ runner.temp }}/archive-catalog-pages
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          git worktree add "$PAGE_WORKTREE" origin/gh-pages
          python3 - <<'PY'
          import json, os, shutil
          from pathlib import Path
          report=json.loads(Path('projects/home-build.json').read_text())
          target=Path(os.environ['PAGE_WORKTREE'])
          for name in report['files']:
              rel=Path(name)
              if rel.is_absolute() or '..' in rel.parts or rel.parts[0]!='projects':
                  raise RuntimeError('Unexpected generated path')
              dest=target/rel
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(rel,dest)
          print('Published index assets:',len(report['files']))
          print('Detailed records and media were not modified.')
          PY
          git -C "$PAGE_WORKTREE" add -- projects
          if git -C "$PAGE_WORKTREE" diff --cached --name-status | grep -q '^D'; then
            echo 'Refusing deletion of a published archive file'; exit 1
          fi
          if ! git -C "$PAGE_WORKTREE" diff --cached --quiet; then
            git -C "$PAGE_WORKTREE" commit -m 'Publish canonical ZIP catalog and archive policy updates'
            git -C "$PAGE_WORKTREE" push origin HEAD:gh-pages
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-archive-catalog-report
          path: projects/home-build.json
