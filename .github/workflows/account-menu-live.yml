name: Verify deployed account menus
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'services/suite-platform/tests/account-menu-live.cjs'
      - '.github/workflows/account-menu-live.yml'
  workflow_run:
    workflows: ['Publish compressed static site', 'pages build and deployment']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: deployed-account-menu-verification
  cancel-in-progress: true
jobs:
  live-menu:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: services/suite-platform/tests
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/suite-ui" --no-save --ignore-scripts --no-audit --no-fund playwright
          "$RUNNER_TEMP/suite-ui/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify public guest account menus without logging in
        env:
          SUITE_UI_RUNTIME: '${{ runner.temp }}/suite-ui'
          SUITE_UI_OUTPUT: '${{ runner.temp }}/account-menu-live'
        run: node services/suite-platform/tests/account-menu-live.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-account-menu-verification
          path: '${{ runner.temp }}/account-menu-live'
          retention-days: 7
