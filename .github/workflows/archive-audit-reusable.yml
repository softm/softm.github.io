name: Archive source and media audit
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Block accidental archive detail or media loss
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess, sys
          media={'.jpg','.jpeg','.png','.webp','.gif','.avif','.heic','.heif','.svg','.mp4','.mov','.m4v','.webm','.m4a','.mp3','.wav','.aac','.ogg','.flac','.pdf','.docx','.xlsx','.hwp','.hwpx','.zip','.srt','.vtt'}
          detail={'.html','.htm','.md'}
          roots=('archive/','records/','reports/','public/archive/','private_assets/','private-assets/')
          def names(ref=None):
              if ref:
                  try: raw=subprocess.check_output(['git','ls-tree','-r','--name-only','-z',ref])
                  except subprocess.CalledProcessError: return []
              else:
                  raw=subprocess.check_output(['git','ls-files','-z'])
              return [pathlib.PurePosixPath(p) for p in raw.decode(errors='replace').split('\0') if p]
          prev=names('HEAD^')
          if not prev:
              print('No parent tree available; preservation comparison skipped.')
              raise SystemExit(0)
          cur=names()
          def counts(items):
              return {
                  'media':sum(1 for p in items if p.suffix.lower() in media),
                  'detail':sum(1 for p in items if p.suffix.lower() in detail and p.as_posix().startswith(roots)),
              }
          before,after=counts(prev),counts(cur)
          removed=[p.as_posix() for p in prev if p not in set(cur) and (p.suffix.lower() in media or (p.suffix.lower() in detail and p.as_posix().startswith(roots)))]
          if after['media'] < before['media'] or after['detail'] < before['detail']:
              msg=subprocess.check_output(['git','log','-1','--pretty=%B']).decode(errors='replace')
              if '[archive-remove-ok]' not in msg:
                  print('::error::Archive preservation guard blocked this change.')
                  print('Before:',before,'After:',after)
                  print('Removed archive assets/details:')
                  for p in removed[:200]: print(' -',p)
                  print('Existing detailed HTML/MD and media must not be reduced during normal archive deployment.')
                  sys.exit(1)
          print('Archive preservation guard OK:',before,'→',after)
          PY
      - name: Inventory actual attachments and validate local references
        shell: bash
        run: |
          python3 - <<'PY'
          import collections, hashlib, html, json, os, pathlib, re, subprocess, urllib.parse, urllib.request, urllib.error
          from html.parser import HTMLParser
          from datetime import datetime, timezone
          root=pathlib.Path.cwd()
          paths=[pathlib.Path(p) for p in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if p]
          types={'.jpg':'image','.jpeg':'image','.png':'image','.webp':'image','.gif':'image','.avif':'image','.heic':'image','.heif':'image','.svg':'image','.mp4':'video','.mov':'video','.m4v':'video','.webm':'video','.m4a':'audio','.mp3':'audio','.wav':'audio','.aac':'audio','.ogg':'audio','.flac':'audio','.pdf':'document','.docx':'document','.xlsx':'document','.hwp':'document','.hwpx':'document','.zip':'archive','.srt':'transcript','.vtt':'transcript'}
          assets=[]; counts=collections.Counter(); missing=[]; manifests=[]
          for p in paths:
              if p.is_symlink() or not p.is_file(): continue
              kind=types.get(p.suffix.lower())
              if kind:
                  digest=hashlib.sha256()
                  with p.open('rb') as f:
                      for block in iter(lambda:f.read(1024*1024),b''): digest.update(block)
                  assets.append({'path':p.as_posix(),'kind':kind,'bytes':p.stat().st_size,'sha256':digest.hexdigest()})
                  counts[kind]+=1
              if p.name in ('assets-manifest.json','asset-manifest.json','manifest.json','project.json'):
                  try:
                      obj=json.loads(p.read_text('utf-8'))
                      manifests.append({'path':p.as_posix(),'data':obj})
                  except (ValueError,UnicodeError): pass
          class Links(HTMLParser):
              def __init__(self): super().__init__(); self.urls=[]
              def handle_starttag(self, tag, attrs):
                  for key,value in attrs:
                      if key in ('src','href','poster') and value: self.urls.append(value)
          for p in paths:
              if p.suffix.lower() not in ('.html','.htm','.md') or not p.is_file() or p.is_symlink() or p.stat().st_size>5000000: continue
              text=p.read_text('utf-8',errors='replace')
              parser=Links(); parser.feed(text)
              urls=parser.urls+re.findall(r'!?\[[^\]]*\]\(([^\n)]+)\)',text)
              for raw in urls:
                  url=urllib.parse.urlsplit(html.unescape(raw.strip().split(' "')[0]))
                  if url.scheme or url.netloc or not url.path: continue
                  value=urllib.parse.unquote(url.path)
                  if pathlib.Path(value).suffix.lower() not in types: continue
                  # Absolute application routes are not filesystem paths: only inspect relative references here.
                  if value.startswith('/'): continue
                  target=(p.parent/value).resolve()
                  if root not in target.parents or not target.is_file():
                      missing.append({'document':p.as_posix(),'reference':raw})
          report={'schemaVersion':1,'repository':os.environ['GITHUB_REPOSITORY'],'sourceCommit':os.environ['GITHUB_SHA'],'checkedAt':datetime.now(timezone.utc).isoformat(),'scope':'git-tracked files only; historical chat completeness is not inferred','counts':dict(counts),'assetCount':len(assets),'assets':assets,'missingLocalReferences':missing,'declaredManifests':manifests}
          # The central directory also checks anonymous HTTP behavior, never fetching private content with a token.
          config=root/'projects/projects.json'
          if config.exists():
              checks=[]
              for project in json.loads(config.read_text('utf-8')).get('projects',[]):
                  for role in ('homeUrl','publicUrl','privateUrl'):
                      address=project.get(role)
                      if not address: continue
                      result={'project':project.get('title'),'role':role,'url':address}
                      try:
                          request=urllib.request.Request(address,headers={'User-Agent':'softm-archive-audit/1.0'})
                          with urllib.request.urlopen(request,timeout=20) as response:
                              body=response.read(2000000).decode('utf-8',errors='replace')
                              result.update(status=response.status,finalUrl=response.url)
                              gate=bool(re.search(r'type\s*=\s*[\"\x27]password|authentication required|log in to vercel|로그인|접근 인증',body,re.I))
                              result['authenticationScreenDetected']=gate
                              result['interpretation']='login screen observed; post-login access not tested' if role=='privateUrl' and gate else 'anonymous content requires privacy review' if role=='privateUrl' else 'HTTP response observed; not a visual test'
                      except urllib.error.HTTPError as error:
                          result.update(status=error.code,interpretation='access blocked' if error.code in (401,403) else 'HTTP error')
                      except Exception as error: result.update(status=None,error=type(error).__name__)
                      checks.append(result)
              report['directoryHttpChecks']=checks
          out=root/'audit-result'; out.mkdir(exist_ok=True)
          (out/'archive-audit.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write('# Archive audit\n\nSource: `'+os.environ['GITHUB_SHA']+'`\n\n')
              f.write(f'Actual tracked attachments: **{len(assets)}**. Broken relative attachment references: **{len(missing)}**.\n\n')
              f.write('This is a repository inventory, not confirmation that all historical chat attachments were recovered. Authenticated playback still requires verification. The detailed artifact retains the visibility of this repository.\n')
          print(json.dumps({'assetCount':len(assets),'counts':dict(counts),'missingRelativeReferences':len(missing)},ensure_ascii=False))
          PY
      - name: Validate archive ZIP packages
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, sys, zipfile
          root=pathlib.Path.cwd()
          errors=[]
          zips=[p for p in root.rglob('*.zip') if '.git' not in p.parts and 'audit-result' not in p.parts]
          for zp in zips:
              # Generic uploaded archives may be source material. Enforce the package contract only
              # when the archive declares itself as a generated record package.
              try:
                  with zipfile.ZipFile(zp) as z:
                      names=[n for n in z.namelist() if not n.endswith('/')]
                      basenames={pathlib.PurePosixPath(n).name for n in names}
                      is_package=('manifest.json' in basenames and
                                  ('README.md' in basenames or 'summary.md' in basenames) and
                                  'index.html' in basenames)
                      if not is_package:
                          continue
                      bad=z.testzip()
                      if bad: errors.append(f'{zp}: corrupt member {bad}'); continue
                      manifest_name=next(n for n in names if pathlib.PurePosixPath(n).name=='manifest.json')
                      try: manifest=json.loads(z.read(manifest_name).decode('utf-8'))
                      except Exception as e:
                          errors.append(f'{zp}: invalid manifest.json ({type(e).__name__})'); continue
                      entries=manifest.get('assets') or manifest.get('files') or []
                      by_name=set(names)
                      for item in entries:
                          if not isinstance(item,dict): continue
                          path=item.get('path')
                          if not path or item.get('missing'): continue
                          # Accept a manifest path relative to the manifest directory.
                          base=pathlib.PurePosixPath(manifest_name).parent
                          candidates={path, (base/path).as_posix()}
                          actual=next((n for n in candidates if n in by_name),None)
                          if not actual:
                              errors.append(f'{zp}: manifest file missing: {path}'); continue
                          data=z.read(actual)
                          if item.get('bytes') is not None and len(data)!=int(item['bytes']):
                              errors.append(f'{zp}: byte mismatch: {path}')
                          if item.get('sha256'):
                              digest=hashlib.sha256(data).hexdigest()
                              if digest.lower()!=str(item['sha256']).lower():
                                  errors.append(f'{zp}: sha256 mismatch: {path}')
              except zipfile.BadZipFile:
                  errors.append(f'{zp}: invalid ZIP')
          if errors:
              for e in errors: print('::error::'+e)
              sys.exit(1)
          print(f'ZIP package audit OK; checked {len(zips)} tracked ZIP candidate(s).')
          PY
      - name: Retain audit in this repository only
        uses: actions/upload-artifact@v7.0.1
        with:
          name: archive-audit-${{ github.sha }}
          path: audit-result/archive-audit.json
          retention-days: 30
          if-no-files-found: error
