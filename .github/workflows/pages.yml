name: Configure GitHub Pages branch deployment

on:
  push:
    branches:
      - main
      - codex/configure-pages-branch-20260821
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: pages-configuration
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Use main branch as the Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          response_file="$(mktemp)"
          status="$(curl -L -sS -o "$response_file" -w '%{http_code}' \
            -X PUT \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"build_type":"legacy","source":{"branch":"main","path":"/"}}')"
          if [ "$status" != "204" ]; then
            echo "Pages source update failed with HTTP $status"
            sed -n '1,120p' "$response_file"
            exit 1
          fi
          echo "GitHub Pages now deploys from main:/"
