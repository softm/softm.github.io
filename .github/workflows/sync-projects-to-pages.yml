name: Sync projects index to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "projects/**"
      - ".github/workflows/sync-projects-to-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-projects-to-pages
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main source
        uses: actions/checkout@v4
        with:
          ref: main
          path: source

      - name: Checkout gh-pages publishing branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: Copy projects directory and publish
        shell: bash
        run: |
          set -euo pipefail
          rm -rf pages/projects
          cp -a source/projects pages/projects

          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects

          if git diff --cached --quiet; then
            echo "projects directory is already synchronized"
            exit 0
          fi

          git commit -m "sync: projects index from main ${GITHUB_SHA}"
          git push origin HEAD:gh-pages
