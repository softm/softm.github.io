name: Publish project homes
on:
  push:
    branches: [main]
    paths:
      - projects/home-generator.py
      - projects/home-generator-core.py
      - projects/project-home.js
      - projects/project-home.css
      - projects/project-home.test.cjs
      - projects/test-title-parity.cjs
      - projects/verify-title-parity-live.py
      - projects/CHAT-TITLE-POLICY.md
      - projects/view-controls.js
      - projects/view-controls.css
      - projects/view-controls.test.cjs
      - projects/chat-metadata.json
      - projects/projects.json
      - projects/archive-sync.js
      - projects/archive-sync.test.cjs
      - projects/sync-archive-catalog.py
      - 'projects/archive-deployment/**'
      - .github/workflows/publish-project-homes.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-project-homes
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Generate public project homes and verify preserved metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin main
          node projects/project-home.test.cjs
          node projects/test-title-parity.cjs
          python3 projects/home-generator.py
          node projects/archive-sync.test.cjs
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('projects/projects.json').read_text())
          aliases={'baksok-public':'baksok','mine-private':'mine'}
          missing=[]
          for p in data['projects']:
              slug=aliases.get(p['repo'],p['repo'].removesuffix('-private'))
              f=Path('projects')/slug/'index.html'
              if not f.is_file() or f.stat().st_size < 500:
                  missing.append(str(f))
          if missing:
              raise SystemExit('Missing project archive hubs: '+', '.join(missing))
          print(f'Archive hubs verified: {len(data["projects"])}')
          PY
          git add -- projects
          if git diff --cached --name-status | grep -q '^D'; then
            echo 'Refusing to delete an existing archive file'; exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Publish project browser views and preserve existing chat links'
            git push origin HEAD:main
          fi
      - name: Synchronize only generated public files to publishing branch
        shell: bash
        env:
          PAGE_WORKTREE: ${{ runner.temp }}/project-home-pages
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          git worktree add "$PAGE_WORKTREE" origin/gh-pages
          python3 - <<'PY'
          import json, os, shutil
          from pathlib import Path
          report=json.loads(Path('projects/home-build.json').read_text())
          target=Path(os.environ['PAGE_WORKTREE'])
          for name in report['files']:
              rel=Path(name)
              if rel.is_absolute() or '..' in rel.parts or rel.parts[0]!='projects':
                  raise RuntimeError('Unexpected output path')
              dest=target/rel
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(rel,dest)
          print(json.dumps({'generatedHomes':report['projectCount'],'copiedFiles':len(report['files']),'detailsAndMediaModified':False}))
          PY
          git -C "$PAGE_WORKTREE" add -- projects
          if git -C "$PAGE_WORKTREE" diff --cached --name-status | grep -q '^D'; then
            echo 'Refusing to delete a published file'; exit 1
          fi
          if ! git -C "$PAGE_WORKTREE" diff --cached --quiet; then
            git -C "$PAGE_WORKTREE" commit -m 'Publish project browser views, sorting and record summaries'
            git -C "$PAGE_WORKTREE" push origin HEAD:gh-pages
          fi
          echo '### Project home sources synchronized' >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r=json.loads(Path('projects/home-build.json').read_text())
          print('|Project|Public list|Private list|Home|\n|---|---:|---:|---|')
          for p in r['projects']:
              print('|{}|{}|{}|{}|'.format(p['title'],p['publicEntries'],p['privateEntries'],p['homeUrl']))
          print('\nPublication is checked separately. No private source content or media was copied.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: project-home-build-report
          path: projects/home-build.json
  verify-live:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: projects
      - name: Verify deployed entry pages and all four title renderers
        env:
          TITLE_PARITY_LIVE_REPORT: ${{ runner.temp }}/title-parity-live.json
        run: python3 projects/verify-title-parity-live.py
      - name: Compare public detail headings without fetching private origins
        run: python3 projects/audit-live-titles.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-title-parity-verification
          path: |
            ${{ runner.temp }}/title-parity-live.json
            projects/title-audit/live-titles.json
