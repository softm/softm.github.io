name: Register four reviewed hwagok media inbox folders
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-hwagok-media-inbox-20261008.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: public-project-homes
  cancel-in-progress: false
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: projects
      - name: Read reviewed batch implementation at its exact committed revision
        uses: actions/checkout@v4
        with:
          repository: softm/hwagok-farm
          ref: 81331bca53d1d18453f5be315e2a3bb5d03eec4a
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: scripts
          path: .batch-tools
          persist-credentials: false
      - name: Wait for deployed record metadata and merge only the authorized farm records
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 -u .batch-tools/scripts/archive_media_inbox_20261008.py catalog
          node projects/project-home.test.cjs
          node projects/archive-sync.test.cjs
          node projects/inbox-list-title.test.cjs
          git add -- projects/projects.json
          if ! git diff --cached --quiet; then
            git commit -m 'projects: register verified farm inbox titles; preserve private and unrelated records'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Use existing Pages publishing source without changing repository or protection settings
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_WORKTREE: ${{ runner.temp }}/hwagok-media-central
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pages" > /tmp/farm-batch-pages.json
          SOURCE="$(python3 - <<'PY'
          import json,sys
          d=json.load(open('/tmp/farm-batch-pages.json'))
          print(json.dumps({'build_type':d.get('build_type'),'source':d.get('source')}),file=sys.stderr)
          assert d['build_type']=='legacy','Use existing workflow deployment; do not change Pages settings'
          assert d['source']['branch'] in ('main','gh-pages') and d['source']['path']=='/','Unexpected existing Pages source'
          print(d['source']['branch'])
          PY
          )"
          if [ "$SOURCE" = gh-pages ]; then
            git fetch --depth=1 origin gh-pages
            git worktree add "$PAGE_WORKTREE" FETCH_HEAD
            mkdir -p "$PAGE_WORKTREE/projects"
            cp projects/projects.json "$PAGE_WORKTREE/projects/projects.json"
            git -C "$PAGE_WORKTREE" add -- projects/projects.json
            if ! git -C "$PAGE_WORKTREE" diff --cached --quiet; then
              git -C "$PAGE_WORKTREE" commit -m 'projects: publish reviewed hwagok media folder titles'
              git -C "$PAGE_WORKTREE" push origin HEAD:gh-pages
            fi
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" > /tmp/farm-batch-build.json
          python3 -u - <<'PY'
          import json,time
          from urllib.request import Request,urlopen
          wanted=['20260905 무 열무 파종','20260913 씨박 수확','20260913 열무왕무밭 물주고 이음 재배중','20260913 쪽파 정식 로터리 12중 한줄 80구멍 약 1000개']
          for attempt in range(120):
              try:
                  with urlopen(Request('https://softm.github.io/projects/projects.json?batch='+str(time.time_ns()),headers={'Cache-Control':'no-cache'}),timeout=40) as r:d=json.load(r)
                  p=next(p for p in d['projects'] if p['repo']=='hwagok-farm')
                  assert p.get('lastArchiveBatch')=='20261008-hwagok-media-inbox'
                  assert all(sum(x.get('listTitle')==name for x in p['links'])==1 for name in wanted)
                  print(json.dumps({'published':True,'public':sum(x.get('visibility')=='public' for x in p['links']),'private':sum(x.get('visibility')=='private' for x in p['links']),'recordTitles':wanted},ensure_ascii=False))
                  break
              except Exception as e:print('Waiting for actual published catalogue:',type(e).__name__,flush=True)
              time.sleep(12)
          else:raise SystemExit('Catalogue source committed but live publication not verified')
          PY
